# Supply-chain hardening — pnpm 11.5.0 (pinado via packageManager)
# Fonte: handbook/reference/pnpm/supply-chain-security.md + settings.md
# Todos os settings (exceto auth/registry) vivem AQUI, nunca em .npmrc. (settings.md:8)

# --- 0. Overrides de segurança (força versão corrigida em trans-deps) ---
# undici: CVEs de DoS (WebSocket — memória ilimitada) + bypass de validação de cert TLS, faixa
# vulnerável >=7.23.0 <7.28.0. Só entra como trans-dep de DEV (jsdom→undici, via vitest), mas o
# audit/Trivy flagam o lockfile → força >=7.28.0 (corrigido). Pareia com o web.Dockerfile (runtime
# Chainguard re-pinado p/ o node-gyp Wolfi). pnpm 11: overrides vivem AQUI (package.json.pnpm não é lido).
overrides:
  undici: '^7.28.0'
  # seroval (+ plugins): serialização SSR do TanStack Router/Start. Advisories critical/high na faixa
  # <=1.6.2 → precisa >=1.6.3. PINADO EXATO em 1.7.1 porque a 1.7.2 (24/10/2026) dos DOIS pacotes saiu
  # SEM provenance, quebrando a cadeia de trusted publisher das 1.7.0/1.7.1 (`trustPolicy: no-downgrade`
  # recusou — possível takeover). Antes de soltar o pin: confirmar provenance da versão-alvo
  # (`pnpm view seroval@X dist.attestations`). O range do router-core é ^1.6.7, então o pin satisfaz.
  seroval: '1.7.1'
  seroval-plugins: '1.7.1'
  # handlebars: 2 critical + 1 moderate (JS injection) em <=4.7.9. Só DEV (eslint-plugin-boundaries@6 →
  # @boundaries/elements@2, que PINA 4.7.9 exato). 4.7.10 é patch da mesma linha. Sai quando o plugin for
  # para a v7 (que já traz @boundaries/elements@3 + handlebars 4.7.10) — major no motor dos boundaries
  # (§I), por isso não entrou junto com a correção de segurança.
  handlebars: '4.7.10'

# --- 1. Postinstall scripts: allowlist explícita (allowBuilds) ---
# strictDepBuilds=true (default) => deps com build NÃO listadas aqui falham o install.
# unrs-resolver: resolver nativo do eslint-import-resolver-typescript. Funciona via
# binários pré-compilados (napi) — o lint roda sem rodar o script de install, então
# bloqueamos (false). NUNCA usar dangerouslyAllowAllBuilds.
allowBuilds:
  # esbuild: binário via napi/optional deps (`esbuild --version` roda sem o script de
  # install). Vem do vite/TanStack; bloqueamos o build script (mesmo padrão do unrs).
  esbuild: false
  unrs-resolver: false
  # playwright: o pacote npm NÃO precisa rodar build script no install — os browsers são
  # baixados explicitamente via `pnpm exec playwright install chromium` (CDN MS, fora do
  # registry/quarentena). Bloqueamos o script (mesmo padrão), download é passo consciente.
  playwright: false

# --- 2. Bloquear sources exóticas em trans-deps (default já true) ---
blockExoticSubdeps: true

# --- 3. Quarentena de versões recém-publicadas ---
# 1440 = 1 dia. Strict (v11): falha o install se nenhuma versão do range satisfizer.
# ignoreMissingTime: não falha por pacotes sem metadado de data de publicação.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
# Exceções por VERSÃO EXATA: deps já vetadas do bootstrap, publicadas no mesmo dia
# (TanStack publica quase diariamente). Futuras atualizações de qualquer pacote
# — inclusive estes — ainda passam pela quarentena de 1 dia.
minimumReleaseAgeExclude:
  - '@eslint-zod/utils@2.1.1'
  - '@tanstack/react-router@1.170.9'
  - '@tanstack/react-start@1.168.16'
  - '@tanstack/react-start-client@1.168.6'
  - '@tanstack/react-start-rsc@0.1.15'
  - '@tanstack/react-start-server@1.167.11'
  - '@tanstack/router-core@1.171.7'
  - '@tanstack/router-generator@1.167.11'
  - '@tanstack/router-plugin@1.168.12'
  - '@tanstack/start-client-core@1.170.5'
  - '@tanstack/start-plugin-core@1.171.8'
  - '@tanstack/start-server-core@1.169.6'
  - '@tanstack/start-storage-context@1.167.9'
  - 'electron-to-chromium@1.5.364'
  - 'eslint-plugin-zod@4.5.3'

# --- 4. Política de confiança (trustPolicy) ---
# no-downgrade: bloqueia versão com evidência de confiança menor que uma anterior.
# semver@6.3.1: pacote antigo/ubíquo sem provenance — falso-positivo vetado explicitamente.
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'
  # dev-tooling (vitest tree): trust-downgrade = trusted-publisher → provenance (falso-positivo conhecido)
  - 'tinyexec@1.2.2'
