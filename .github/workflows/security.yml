name: security

# Blindagem de supply-chain e da camada de homologação (ADR-0023). Nasceu do incidente de 28/10/2026:
# TanStack Start (XSS refletido), seroval e zod vulneráveis EM PRODUÇÃO sem nenhum sinal — o front não
# rodava auditoria, e no core-api ela existia mas não era obrigatória (o vermelho virava ruído).
#
# Quatro jobs, cada um com UMA função:
#   audit-prod  (BLOQUEANTE, check obrigatório) — dependências de runtime, falha em high/critical.
#   audit-full  (RELATÓRIO) — todas as deps, inclusive dev; dá visibilidade, não bloqueia.
#   homologacao (BLOQUEANTE, check obrigatório) — a `main` (produção) só recebe PR vindo da `develop`
#               (homologação), de `release/*` (promoção) ou de `hotfix/*` (emergência, com aviso).
#   scheduled   (ALERTA) — todo dia, audita `main` e `develop` mesmo sem PR; vermelho abre/atualiza
#               uma issue `seguranca` ATRIBUÍDA aos responsáveis (o GitHub notifica por e-mail na hora)
#               e a fecha sozinho quando volta a verde.
#
# Falha FECHADA: se o registry de advisories estiver fora do ar, o gate NÃO aprova sem auditar
# (diferente do `--ignore-registry-errors`, que sai 0 em silêncio). Há 3 tentativas para tolerar
# instabilidade; esgotadas, o check fica vermelho com a causa explícita no log.
on:
  pull_request:
    branches: [go-live-front, develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Diário 09:00 UTC (06:00 BRT) — pega advisory publicado de madrugada antes do expediente.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-prod:
    name: audit (produção — bloqueante)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit (dependencies de runtime ≥ high) — falha fechada
        run: bash .github/scripts/audit-gate.sh --prod

  audit-full:
    name: audit (todas as deps — relatório)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit completo (inclui devDependencies — não bloqueia)
        run: bash .github/scripts/audit-gate.sh --all

  homologacao:
    name: homologação (origem do PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Nomes de branch vêm por ENV, nunca interpolados no script: `head_ref` é texto controlado por
      # quem abre o PR e, interpolado com ${{ }}, viraria injeção de comando no runner.
      - name: A main só recebe da homologação
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ]; then
            echo "PR para '$BASE_REF' — regra só vale para a main."
            exit 0
          fi
          case "$HEAD_REF" in
            develop|release/*)
              echo "✅ '$HEAD_REF' → main: origem homologada."
              ;;
            hotfix/*)
              echo "::warning::HOTFIX direto na main ('$HEAD_REF'). Exceção de emergência: depois do merge, leve a mesma correção para a develop."
              ;;
            *)
              echo "::error::A main (produção) só recebe PR da develop, de release/* ou de hotfix/*. '$HEAD_REF' precisa passar pela develop (homologação) antes."
              exit 1
              ;;
          esac

  scheduled:
    name: audit agendado (${{ matrix.ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        ref: [main, develop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit (dependencies de runtime ≥ high)
        env:
          AUDIT_OUT: ${{ runner.temp }}/audit.txt
        run: bash .github/scripts/audit-gate.sh --prod

      - name: Alerta — abre ou atualiza a issue (atribuída)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ matrix.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEES: GabrielAderaldo,lekadecastro
          AUDIT_OUT: ${{ runner.temp }}/audit.txt
        run: bash .github/scripts/audit-alert.sh open

      - name: Resolve — fecha a issue quando voltar a verde
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ matrix.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/audit-alert.sh close
