name: build-publish (deploy suspenso)

# Builda a imagem de produção (front + BFF, target `runtime` Chainguard), escaneia com o Trivy e publica no
# GHCR (`:sha-<curto>` e, com o gate verde, `:qa`).
#
# ⚠️ A ETAPA DE DEPLOY ESTÁ SUSPENSA (12/11/2026). Este workflow NÃO entrega a imagem em host nenhum. O
# `name:` diz isso de propósito: o core-api aprendeu que um workflow chamado "deploy" verde sem deployar é
# registro que mente (`core-api/.github/workflows/qa-image.yml`, suspenso em 19/08/2026 pelo mesmo motivo).
#
# Por que saiu: o job `deploy-qa` entrava na tailnet com `secrets.TS_AUTHKEY` e rodava `/opt/erp-qa/deploy.sh`
# na VPS de QA (PBE). A chave venceu em 23/09/2026 (`invalid key: API key does not exist`), e o alvo é a
# VPS PBE, que NÃO é a homologação: a homologação é da Codebit (AWS, acompanha a branch de QA) e não
# depende deste job. Vermelho crônico que ninguém vai tratar treina o time a ignorar workflow vermelho.
#
# Restaurar: o job inteiro está em `git show 3828d537:.github/workflows/build-publish.yml` (rodava depois do
# `build-push`, no mesmo run). Antes, gerar uma auth key nova com `tag:ci` e atualizar o segredo.
#
# Segurança (OWASP CI/CD Top 10 — ADR-0016/0018):
#  - actions de terceiros PINADAS POR COMMIT SHA (CICD-SEC-8); a tag legível fica no comentário ao lado.
#  - GITHUB_TOKEN de permissão mínima POR JOB; provenance + SBOM keyless via OIDC (id-token/attestations).
#  - trigger = push em `develop` (branch de QA), NUNCA `pull_request` de fork com segredo (CICD-SEC-4).
#
# Atualizar um SHA: gh api repos/<owner>/<action>/commits/<tag> --jq .sha

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'handbook/**'
      - 'specs/**'
      - 'e2e/**'
  workflow_dispatch:

concurrency:
  # Serializa por ref e NÃO cancela em andamento — a promoção da `:qa` nunca é abortada no meio (pushes
  # rápidos enfileiram em vez de cancelar a publicação anterior).
  group: build-publish-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push no GHCR
  id-token: write # OIDC keyless p/ as attestations (provenance/SBOM)
  attestations: write # grava as attestations no GHCR

env:
  IMAGE: ghcr.io/erp-bem-comum/bemcomum-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Job-level SUBSTITUI o bloco do workflow, então repete o que já era herdado + `issues: write`, que o
    # aviso de falha precisa. Least privilege continua: nada aqui além do que os steps usam de fato.
    permissions:
      contents: read
      packages: write # push no GHCR + retag da :qa
      id-token: write # OIDC keyless p/ as attestations
      attestations: write
      issues: write # p/ o aviso de falha abrir/comentar issue
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login no ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          # SÓ a tag imutável por SHA. A `:qa` (flutuante, a que o /opt/erp-qa/.env consome) é promovida
          # num step DEPOIS do Trivy — ver "Promove a tag :qa". Publicá-la aqui faria a imagem reprovada
          # virar `:qa` antes do scan rodar, e o `deploy.sh` da VPS (chamado também pelo pipeline do
          # core-api) a puxaria de carona, sem passar por gate nenhum. Foi o que houve entre 28/07 e 10/08.
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build + push (linux/amd64, target runtime, provenance + SBOM)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./web.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true # SLSA build provenance attestation (D3/ADR-0016) — keyless via OIDC
          sbom: true # SBOM attestation

      - name: Scan da imagem (Trivy — falha em HIGH/CRITICAL, SC-001)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true # não bloqueia em CVE sem fix upstream (base distroless); revisar periodicamente

      # O runtime é `cgr.dev/chainguard/node:latest`: a tag não diz versão, e o major pode mudar num re-pin
      # do digest sem ninguém perceber. Aqui se MEDE o Node da imagem recém-construída contra o `.nvmrc`
      # (a fonte, CAS-108), antes da promoção — imagem com major errado nunca vira `:qa`.
      - name: Confere o major do Node na imagem contra o .nvmrc
        run: |
          expected="$(cut -d. -f1 .nvmrc)"
          actual="$(docker run --rm --entrypoint node ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} --version)"
          actual_major="${actual#v}"
          actual_major="${actual_major%%.*}"
          if [ "$actual_major" != "$expected" ]; then
            echo "::error file=web.Dockerfile::A imagem roda Node ${actual}, mas o .nvmrc pede o major ${expected}. Re-pinar o runtime (ou subir o .nvmrc) antes de promover a :qa."
            exit 1
          fi
          echo "Node da imagem: ${actual} (major ${actual_major}, igual ao .nvmrc)."

      # A `:qa` só anda com o gate VERDE. `imagetools create` é retag no REGISTRY: não rebuilda, não perde
      # cache e aponta para o MESMO digest do índice, então provenance e SBOM seguem válidos. Se o Trivy
      # reprovar, este step não roda e a `:qa` continua na última build verde — o `deploy.sh` da VPS passa
      # a puxar código bom mesmo quando quem dispara o deploy é o pipeline do core-api.
      - name: Promove a tag :qa (só depois do gate verde)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:qa \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # Sem isso, o efeito do step acima é SILENCIOSO: gate vermelho segura QA na build anterior e ninguém
      # fica sabendo. Foi assim que 12 promoções passaram despercebidas (o `CI` fica verde no mesmo commit,
      # só este workflow quebra). Mesmo molde do aviso de expiração da TS_AUTHKEY, no job de deploy.
      - name: Abre/comenta issue se o build ou o gate falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🚨 build-publish falhou na develop — QA congelado na build anterior"
          msg="O run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) falhou no commit \`${GITHUB_SHA}\`.
          A tag \`:qa\` NÃO foi promovida — QA segue na última build verde e este commit não chega lá (nem de carona pelo deploy do core-api).
          Se for o gate Trivy com CVE da base: avançar o digest-pin do \`web.Dockerfile\` (runbook do re-pin), **nunca** \`.trivyignore\`.
          _(aviso automático do build-publish)_"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "build-publish falhou in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$msg"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$msg"; fi

